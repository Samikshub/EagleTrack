[theme]
base = "light"
primaryColor = "#59663A"
backgroundColor = "#F5F2E9"
secondaryBackgroundColor = "#E9E5D8"
textColor = "#34392D"
linkColor = "#59663A"
borderColor = "#C2BEAF"
dataframeBorderColor = "#B8B4A5"
dataframeHeaderBackgroundColor = "#DCD8C9"
greenColor = "#1F7A42"
greenTextColor = "#1F7A42"
greenBackgroundColor = "#E2EDDF"
redColor = "#A84F3F"
orangeColor = "#A8753F"
chartCategoricalColors = ["#59663A", "#8A956B", "#B6AA83", "#A84F3F", "#6F7864", "#C3BBA8"]
font = "'DM Sans':https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "'DM Sans':https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["34px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.sidebar]
backgroundColor = "#E7E3D6"
secondaryBackgroundColor = "#DDD9CB"
textColor = "#34392D"
primaryColor = "#59663A"
borderColor = "#D0CBBB"
